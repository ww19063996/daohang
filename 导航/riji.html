<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日记 - 智能极速选线</title>
    <style>
        /* 全局重置与现代化色彩系统变量 */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius-lg: 20px;
            --radius-sm: 10px;
            --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
        }
        /* 核心磨砂玻璃拟态容器 */
        .portal-card {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 32px 28px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 头部标头与呼吸动画 */
        .card-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 12px;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7);
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); }
            100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }
        .title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 14px;
            color: var(--text-sub);
        }
        /* 测速中动态加载态 */
        .racing-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 0 16px;
            text-align: center;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .racing-status {
            font-size: 15px;
            font-weight: 500;
            color: #e2e8f0;
            margin-bottom: 6px;
        }
        .racing-tip {
            font-size: 12px;
            color: var(--text-sub);
        }
        /* 实时线路排行榜列表 */
        .rank-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-sub);
            margin: 20px 0 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .rank-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 240px;
            overflow-y: auto;
        }
        .rank-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-sm);
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .rank-item:hover {
            background: rgba(15, 23, 42, 0.8);
            border-color: rgba(99, 102, 241, 0.3);
        }
        .domain-name {
            font-family: monospace;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 65%;
        }
        .latency-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .lat-fast { color: #34d399; background: rgba(16, 185, 129, 0.15); }
        .lat-medium { color: #fbbf24; background: rgba(245, 158, 11, 0.15); }
        .lat-slow { color: #f87171; background: rgba(239, 68, 68, 0.15); }
        .lat-testing { color: #94a3b8; background: rgba(148, 163, 184, 0.1); }
        /* 优雅降级面板（全部超时或异常时显示） */
        .fallback-panel {
            display: none;
            margin-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            text-align: center;
        }
        .fallback-alert {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .manual-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #c7d2fe;
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .manual-btn:hover {
            background: var(--primary);
            color: #ffffff;
        }
        .help-support {
            margin-top: 16px;
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.6;
        }
        .help-support span {
            color: #38bdf8;
            user-select: all;
        }
    </style>
</head>
<body>
    <div class="portal-card">
        <!-- 头部品牌信息与状态 -->
        <div class="card-header">
            <div class="brand-badge">
                <span class="pulse-dot"></span>
                <span id="badgeText">智能线路引擎巡航中</span>
            </div>
            <h1 class="title">日记</h1>
            <p class="subtitle" id="subtitleText">正在探测全球最佳可用节点并极速接入...</p>
        </div>

        <!-- 竞速与加载状态区 -->
        <div class="racing-box" id="racingBox">
            <div class="spinner" id="spinner"></div>
            <div class="racing-status" id="racingStatus">并发竞速测速中...</div>
            <div class="racing-tip" id="racingTip">即将自动跳转到响应速度最快的线路</div>
        </div>

        <!-- 实时线路排行榜 -->
        <div class="rank-title">
            <span>线路竞速榜单</span>
            <span id="testedCount">0/0 完成</span>
        </div>
        <ul class="rank-list" id="rankList"></ul>

        <!-- 优雅降级面板（全量失败或超时时激活） -->
        <div class="fallback-panel" id="fallbackPanel">
            <div class="fallback-alert">
                ⚠️ 检测到您当前的网络环境访问所有自动线路均响应超时或受阻。请尝试点击下方备用线路手动直连。
            </div>
            <div id="manualRoutesContainer"></div>
            <div class="help-support">
                如持续无法访问，请反馈至技术支持渠道<br>
                备用客服邮箱: <span>service@support-center.internal</span>
            </div>
        </div>
    </div>

    <script>
        /**
         * 动态解密与探活竞速主控制器
         */
        (function() {
            // 基础防抓取混淆：运行时在客户端动态将 Base64 编码的域名池解码
            const RAW_BASE64_DOMAINS = "WyJodHRwOi8vZnJwOS5hYXN6eGMuYXNpYToxMDI3Mi9iYW9iaWFvLmh0bWwiLCAiaHR0cDovL3NpbWluLmV1Lm9yZzo3MDA1L2Jhb2JpYW8uaHRtbCJd"; // 服务端注入的 Base64 密文
            const SLUG = "riji"; // 项目唯一标识
            const PROBE_PATH = "/favicon.ico"; // 探活路径
            const TIMEOUT_MS = 3000; // 超时时间（毫秒）
            const ENABLE_STICKY = 0 === 1; // 是否启用线路记忆
            const STICKY_DAYS = 7; // 记忆有效期天数
            const STORAGE_KEY = 'sticky_route_' + SLUG; // 本地缓存 Key

            // DOM 元素引用缓存
            const racingStatus = document.getElementById('racingStatus');
            const racingTip = document.getElementById('racingTip');
            const badgeText = document.getElementById('badgeText');
            const subtitleText = document.getElementById('subtitleText');
            const testedCount = document.getElementById('testedCount');
            const rankList = document.getElementById('rankList');
            const fallbackPanel = document.getElementById('fallbackPanel');
            const manualRoutesContainer = document.getElementById('manualRoutesContainer');
            const spinner = document.getElementById('spinner');

            let domains = []; // 解码后的域名列表
            try {
                // 解码 Base64 并反序列化为 JavaScript 数组
                domains = JSON.parse(decodeURIComponent(escape(window.atob(RAW_BASE64_DOMAINS))));
            } catch(e) {
                try { domains = JSON.parse(window.atob(RAW_BASE64_DOMAINS)); } catch(err) { domains = []; }
            }

            if (!domains || domains.length === 0) {
                racingStatus.innerText = '暂无可用线路配置';
                spinner.style.display = 'none';
                return;
            }

            testedCount.innerText = '0/' + domains.length + ' 探活';

            // 渲染初始等待状态的排行榜占位列表
            const rankItemsMap = {};
            domains.forEach(function(url, idx) {
                const li = document.createElement('li');
                li.className = 'rank-item';
                li.innerHTML = '<span class="domain-name">' + (idx + 1) + '. ' + url + '</span>' +
                               '<span class="latency-badge lat-testing">测速中...</span>';
                rankList.appendChild(li);
                rankItemsMap[url] = li;
            });

            let hasJumped = false; // 是否已经触发了最终跳转防重复锁
            let finishedCount = 0; // 已完成测速探测的节点计数

            /**
             * 参数透传与 Hash 保持：拼接当前页面的 Query 参数和 Hash 锚点后跳转
             */
            function executeRedirect(targetBaseUrl, latency) {
                if (hasJumped) return; // 避免重复触发跳转
                hasJumped = true; // 锁定跳转状态

                // 线路记忆：将优选成功的域名存入客户端 localStorage
                if (ENABLE_STICKY) {
                    try {
                        const record = {
                            url: targetBaseUrl,
                            expireAt: Date.now() + (STICKY_DAYS * 24 * 60 * 60 * 1000)
                        };
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(record));
                    } catch(e) {}
                }

                // 更新界面文案与动效
                badgeText.innerText = '已锁定最优节点';
                racingStatus.innerText = '⚡ 最优节点选定，立即跳转！';
                racingTip.innerText = '耗时仅 ' + latency + 'ms，即将自动接入目标系统...';
                spinner.style.borderTopColor = 'var(--success)';

                // 获取当前页面的完整搜索参数与路由锚点
                const searchParams = window.location.search || ''; // 如 ?aff=888&utm_source=tg
                const hashParams = window.location.hash || ''; // 如 #/dashboard
                const cleanBase = targetBaseUrl.replace(/\/+$/, ''); // 去除末尾斜杠
                const finalTargetUrl = cleanBase + searchParams + hashParams; // 拼接完整目标地址

                // 延迟 150ms 给用户视觉呈现最快节点动效，随后立即触发重定向
                setTimeout(function() {
                    window.location.replace(finalTargetUrl);
                }, 150);
            }

            /**
             * 更新榜单中指定域名的实时延迟视觉标签
             */
            function updateRankItem(url, latency, isSuccess) {
                const li = rankItemsMap[url];
                if (!li) return;
                const badge = li.querySelector('.latency-badge');
                if (!badge) return;

                if (!isSuccess) {
                    badge.className = 'latency-badge lat-slow';
                    badge.innerText = '超时/受阻';
                } else {
                    if (latency < 400) {
                        badge.className = 'latency-badge lat-fast';
                    } else if (latency < 1000) {
                        badge.className = 'latency-badge lat-medium';
                    } else {
                        badge.className = 'latency-badge lat-slow';
                    }
                    badge.innerText = latency + 'ms';
                }
            }

            /**
             * 探针引擎 1：new Image() 加载探活（不受 CORS 跨域制约）
             */
            function probeImage(url, path, timeout) {
                return new Promise(function(resolve, reject) {
                    const img = new Image();
                    const startTime = performance.now();
                    let isDone = false;

                    const timer = setTimeout(function() {
                        if (isDone) return;
                        isDone = true;
                        img.src = '';
                        reject(new Error('timeout'));
                    }, timeout);

                    img.onload = img.onerror = function() {
                        if (isDone) return;
                        isDone = true;
                        clearTimeout(timer);
                        const latency = Math.round(performance.now() - startTime);
                        resolve({ url: url, latency: latency });
                    };

                    // 追加防缓存时间戳
                    const sep = path.indexOf('?') >= 0 ? '&' : '?';
                    img.src = url.replace(/\/+$/, '') + path + sep + '_t=' + Date.now();
                });
            }

            /**
             * 探针引擎 2：Fetch Ping 备用探活（带 no-cors 模式）
             */
            function probeFetch(url, timeout) {
                return new Promise(function(resolve, reject) {
                    if (typeof window.fetch !== 'function') {
                        return reject(new Error('fetch_not_supported'));
                    }
                    const startTime = performance.now();
                    const controller = typeof AbortController === 'function' ? new AbortController() : null;
                    const timer = setTimeout(function() {
                        if (controller) controller.abort();
                        reject(new Error('timeout'));
                    }, timeout);

                    fetch(url, {
                        mode: 'no-cors',
                        cache: 'no-cache',
                        signal: controller ? controller.signal : undefined
                    }).then(function() {
                        clearTimeout(timer);
                        const latency = Math.round(performance.now() - startTime);
                        resolve({ url: url, latency: latency });
                    }).catch(function(err) {
                        clearTimeout(timer);
                        reject(err);
                    });
                });
            }

            /**
             * 对单个域名启动双探针并发探测
             */
            function startSingleDomainRace(url) {
                return new Promise(function(resolve, reject) {
                    let isResolved = false;

                    // 探针 1：Image
                    probeImage(url, PROBE_PATH, TIMEOUT_MS)
                        .then(function(res) {
                            if (!isResolved) {
                                isResolved = true;
                                resolve(res);
                            }
                        }).catch(function() {
                            // 探针 1 超时或失败后，自动启动备用探针 2：Fetch
                            probeFetch(url, Math.min(TIMEOUT_MS, 1500))
                                .then(function(res) {
                                    if (!isResolved) {
                                        isResolved = true;
                                        resolve(res);
                                    }
                                }).catch(function(err) {
                                    if (!isResolved) {
                                        isResolved = true;
                                        reject(err);
                                    }
                                });
                        });
                });
            }

            /**
             * 触发降级保护，显示手动选线列表
             */
            function showFallbackPanel() {
                if (hasJumped) return;
                spinner.style.display = 'none';
                badgeText.innerText = '自动测速无可用节点';
                subtitleText.innerText = '请在下方手动选择备用节点访问';
                racingStatus.innerText = '自动切换遇阻';
                racingTip.innerText = '未能找到畅通的极速节点，请使用下方手动备用路线';
                fallbackPanel.style.display = 'block';

                // 生成所有线路的手动直连按钮
                manualRoutesContainer.innerHTML = '';
                const searchParams = window.location.search || '';
                const hashParams = window.location.hash || '';
                domains.forEach(function(url) {
                    const fullHref = url.replace(/\/+$/, '') + searchParams + hashParams;
                    const a = document.createElement('a');
                    a.className = 'manual-btn';
                    a.href = fullHref;
                    a.target = '_blank';
                    a.innerText = '🚀 备用直连：' + url;
                    manualRoutesContainer.appendChild(a);
                });
            }

            /**
             * 启动全量并发竞速逻辑
             */
            function startFullRace() {
                domains.forEach(function(url) {
                    startSingleDomainRace(url)
                        .then(function(res) {
                            finishedCount++;
                            testedCount.innerText = finishedCount + '/' + domains.length + ' 探活';
                            updateRankItem(url, res.latency, true);
                            // 首个成功响应的节点即为竞速优胜者，直接触发跳转
                            executeRedirect(res.url, res.latency);
                        })
                        .catch(function() {
                            finishedCount++;
                            testedCount.innerText = finishedCount + '/' + domains.length + ' 探活';
                            updateRankItem(url, 0, false);
                            // 若所有节点均测速结束且无人胜出，则启动优雅降级
                            if (finishedCount >= domains.length && !hasJumped) {
                                showFallbackPanel();
                            }
                        });
                });

                // 全局兜底最大定时器，超时强制降级展示
                setTimeout(function() {
                    if (!hasJumped && finishedCount < domains.length) {
                        showFallbackPanel();
                    }
                }, TIMEOUT_MS + 500);
            }

            // 核心入口：判断是否存在且有效的线路记忆（Sticky Session）
            if (ENABLE_STICKY) {
                try {
                    const rawRecord = localStorage.getItem(STORAGE_KEY);
                    if (rawRecord) {
                        const record = JSON.parse(rawRecord);
                        // 判断是否在有效期内，且记录的域名确实在当前可用域名池中
                        if (record && record.url && record.expireAt && Date.now() < record.expireAt && domains.indexOf(record.url) >= 0) {
                            badgeText.innerText = '记忆节点直连';
                            racingStatus.innerText = '检测上次访问记录...';
                            // 优先探活记忆节点
                            startSingleDomainRace(record.url)
                                .then(function(res) {
                                    // 记忆节点健康，直接重定向
                                    executeRedirect(res.url, res.latency);
                                })
                                .catch(function() {
                                    // 记忆节点已失效，清除坏记录并启动全量重新竞速
                                    localStorage.removeItem(STORAGE_KEY);
                                    startFullRace();
                                });
                            return; // 暂缓全量测速，等待记忆节点优先验证
                        }
                    }
                } catch(e) {}
            }

            // 没有记忆或未开启记忆，直接全量并发竞速
            startFullRace();
        })();
    </script>
</body>
</html>
